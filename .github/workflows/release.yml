name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Verify release tag and version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag is not strict SemVer: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Verify tag commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run full test suite
        env:
          SKIP_INTEGRATION_TESTS: "true"
        run: mvn -B verify -DSKIP_INTEGRATION_TESTS=true

      - name: Verify artifact version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          JAR="target/uqpay-sdk-java-$VERSION.jar"
          test -f "$JAR"
          unzip -p "$JAR" META-INF/maven/com.uqpay.sdk/uqpay-sdk-java/pom.properties > /tmp/pom.properties
          grep -Fx "version=$VERSION" /tmp/pom.properties

      - uses: actions/upload-artifact@v4
        with:
          name: java-jars
          path: target/uqpay-sdk-java-*.jar
          if-no-files-found: error

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: java-jars
          path: release-jars

      - name: Check whether release artifact already exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="uqpay-sdk-java-$VERSION.jar"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$ASSET"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}

            Java artifacts are attached to this GitHub Release. Maven Central distribution is tracked separately and is not yet available.

            For a temporary local Maven installation:

            ```bash
            mvn install:install-file \
              -Dfile=uqpay-sdk-java-${{ steps.release.outputs.version }}.jar \
              -DgroupId=com.uqpay.sdk \
              -DartifactId=uqpay-sdk-java \
              -Dversion=${{ steps.release.outputs.version }} \
              -Dpackaging=jar
            ```

            See [README.md](https://github.com/uqpay/uqpay-sdk-java/blob/main/README.md) for usage instructions.
          files: release-jars/*.jar
          draft: false
          prerelease: false
