name: Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      release_mode: ${{ startsWith(github.ref, 'refs/tags/v') }}
      release_tag: ${{ github.ref_name }}

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: java-jars
          path: release-jars

      - name: Check whether release artifact already exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="uqpay-sdk-java-$VERSION.jar"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$ASSET"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}

            Java artifacts are attached to this GitHub Release. This SDK is not distributed through Maven Central; install the thin JAR locally and declare its runtime dependencies in your project.

            For a temporary local Maven installation:

            ```bash
            mvn install:install-file \
              -Dfile=uqpay-sdk-java-${{ steps.release.outputs.version }}.jar \
              -DgroupId=com.uqpay.sdk \
              -DartifactId=uqpay-sdk-java \
              -Dversion=${{ steps.release.outputs.version }} \
              -Dpackaging=jar
            ```

            See [README.md](https://github.com/uqpay/uqpay-sdk-java/blob/main/README.md) for usage instructions.
          files: release-jars/*.jar
          draft: false
          prerelease: false
