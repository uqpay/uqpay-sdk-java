name: Verify only

# Branch pushes validate before a PR exists. No tag trigger or publishing jobs.
on:
  push:
    branches:
      - 'marshall/api-delivery/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_mode:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java-version: ['11', '17', '21', '25']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: ${{ inputs.release_mode }}
          ref: ${{ inputs.release_mode && inputs.release_tag || github.sha }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Verify release tag and version
        if: inputs.release_mode
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag is not strict SemVer: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Verify tag commit is on main
        if: inputs.release_mode
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run full test suite
        env:
          SKIP_INTEGRATION_TESTS: "true"
        run: mvn -B verify -DSKIP_INTEGRATION_TESTS=true

      - name: Verify artifact version
        if: inputs.release_mode
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          JAR="target/uqpay-sdk-java-$VERSION.jar"
          test -f "$JAR"
          unzip -p "$JAR" META-INF/maven/com.uqpay.sdk/uqpay-sdk-java/pom.properties > /tmp/pom.properties
          grep -Fx "version=$VERSION" /tmp/pom.properties

      - uses: actions/upload-artifact@v4
        if: matrix.java-version == '11' && inputs.release_mode
        with:
          name: java-jars
          path: target/uqpay-sdk-java-*.jar
          if-no-files-found: error
